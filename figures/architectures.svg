<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#173642"/></marker></defs><rect width="1200" height="480" fill="#f5f8fa"/><style>text{font-family:Arial,sans-serif;fill:#173642} .b{fill:white;stroke:#008b83;stroke-width:2} .a{fill:none;stroke:#173642;stroke-width:2;marker-end:url(#arrow)}</style><text x="32" y="38" font-size="23" font-weight="bold">STRING-conditioned latent diffusion</text><rect class="b" x="32" y="65" width="255" height="68" rx="9"/><text x="48" y="92" font-size="16">STRING + control node features</text><text x="48" y="115" font-size="16">Intervention markers A / B</text><rect class="b" x="342" y="65" width="250" height="68" rx="9"/><text x="360" y="93" font-size="16">Graph conditioner</text><text x="360" y="117" font-size="16">Symmetric pair vector</text><path class="a" d="M287,99 H342"/><rect class="b" x="32" y="177" width="255" height="68" rx="9"/><text x="48" y="205" font-size="16">Training/control RNA</text><text x="48" y="228" font-size="16">SVD 64 → VAE 24</text><rect class="b" x="342" y="177" width="250" height="68" rx="9"/><text x="360" y="205" font-size="16">Noisy latent + control anchor</text><text x="360" y="228" font-size="16">Timestep</text><path class="a" d="M287,211 H342"/><rect class="b" x="663" y="120" width="230" height="80" rx="9"/><text x="683" y="150" font-size="16">Conditional noise predictor</text><text x="683" y="176" font-size="16">DDPM training objective</text><path class="a" d="M592,99 H622 V145 H663"/><path class="a" d="M592,211 H622 V176 H663"/><rect class="b" x="951" y="120" width="217" height="80" rx="9"/><text x="970" y="148" font-size="16">Noise → latent sampling</text><text x="970" y="173" font-size="16">Decode → pair response</text><path class="a" d="M893,160 H951"/><text x="663" y="237" font-size="15">Best tested configuration: STRING; OT/Hi-C off.</text><path d="M32,270 H1168" stroke="#c9d5da"/><text x="32" y="309" font-size="23" font-weight="bold">STRING-assisted interaction-transfer predictor</text><rect class="b" x="32" y="340" width="255" height="95" rx="9"/><text x="48" y="370" font-size="16">Measured single effects</text><text x="48" y="395" font-size="16">+ training pair residuals</text><text x="48" y="420" font-size="16">STRING neighbour aggregation</text><rect class="b" x="342" y="340" width="250" height="95" rx="9"/><text x="360" y="370" font-size="16">SVD pair features</text><text x="360" y="395" font-size="16">Nearest residual transfer</text><text x="360" y="420" font-size="16">RBF kernel ridge residual</text><path class="a" d="M287,387 H342"/><rect class="b" x="663" y="340" width="505" height="95" rx="9"/><text x="683" y="370" font-size="16">Additive response + 0.75 × nearest residual</text><text x="683" y="395" font-size="16">+ 0.25 × kernel residual</text><text x="683" y="420" font-size="16">Output: predicted pair mean expression</text><path class="a" d="M592,387 H663"/></svg>
